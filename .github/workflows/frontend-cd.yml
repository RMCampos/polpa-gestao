name: Frontend CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Generate version tag
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          TAG="app-v${DATE}.${{ github.run_number }}"
          BUILD_NUMBER="${DATE}.${{ github.run_id }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"
          echo "Generated build number: ${BUILD_NUMBER}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Fetch secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler secrets download \
            --no-file \
            --format env \
            --project polpa-gestao \
            --config prod-tokens \
            | sed 's/"//g' >> $GITHUB_ENV
  
      - run: cd frontend && npm i
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build
        env:
          VITE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          VITE_CPF_CNPJ_API_TOKEN: ${{ env.CPF_CNPJ_API_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ env.GOOGLE_MAPS_API_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            VITE_BACKEND_SERVER=${{ vars.BACKEND_SERVER_URL }}
            VITE_CPF_CNPJ_API_TOKEN=${{ env.CPF_CNPJ_API_TOKEN }}
            VITE_BUILD_NUMBER=${{ steps.version.outputs.build_number }}
            VITE_GOOGLE_MAPS_API_KEY=${{ env.GOOGLE_MAPS_API_KEY }}

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}
  
